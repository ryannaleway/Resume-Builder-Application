<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up or Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-xl-10">
        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="row g-0">
            <div class="col-lg-5 bg-primary text-white p-4 p-lg-5">
              <p class="text-uppercase fw-semibold mb-2">Resume Builder</p>
              <h1 class="display-6 fw-bold">Create an account so your resume header builds itself.</h1>
              <p class="mb-0">Your first name, last name, and business email will automatically appear at the top of every resume preview.</p>
            </div>
            <div class="col-lg-7 p-4 p-lg-5 bg-white">
              <ul class="nav nav-pills mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab" aria-controls="signup-pane" aria-selected="true">Sign Up</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin-pane" type="button" role="tab" aria-controls="signin-pane" aria-selected="false">Sign In</button>
                </li>
              </ul>

              <div class="tab-content">
                <section class="tab-pane fade show active" id="signup-pane" role="tabpanel" aria-labelledby="signup-tab">
                  <form id="signUpForm">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label" for="signUpFirstName">First name</label>
                        <input class="form-control" id="signUpFirstName" aria-label="First name" required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="signUpLastName">Last name</label>
                        <input class="form-control" id="signUpLastName" aria-label="Last name" required>
                      </div>
                    </div>
                    <div class="mt-3">
                      <label class="form-label" for="signUpEmail">Business email</label>
                      <input class="form-control" id="signUpEmail" type="email" aria-label="Business email" required>
                    </div>
                    <div class="mt-3">
                      <label class="form-label" for="signUpPassword">Password</label>
                      <input class="form-control" id="signUpPassword" type="password" aria-label="Password" required>
                    </div>
                    <button class="btn btn-primary mt-4" type="submit">Create Account</button>
                  </form>
                </section>

                <section class="tab-pane fade" id="signin-pane" role="tabpanel" aria-labelledby="signin-tab">
                  <form id="signInForm">
                    <div class="mb-3">
                      <label class="form-label" for="signInEmail">Business email</label>
                      <input class="form-control" id="signInEmail" type="email" aria-label="Sign in email" required>
                    </div>
                    <div class="mb-3">
                      <label class="form-label" for="signInPassword">Password</label>
                      <input class="form-control" id="signInPassword" type="password" aria-label="Sign in password" required>
                    </div>
                    <button class="btn btn-outline-primary" type="submit">Sign In</button>
                  </form>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
