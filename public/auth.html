<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up or Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-xl-10">
        <div class="card border-0 shadow-sm overflow-hidden">
          <div class="row g-0">
            <div class="col-lg-5 bg-primary text-white p-4 p-lg-5">
              <p class="text-uppercase fw-semibold mb-2">Resume Builder</p>
              <h1 class="display-6 fw-bold">Create an account so your resume header builds itself.</h1>
              <p class="mb-0">Your first name, last name, and preferred contact information will automatically appear at the top of every resume preview.</p>
            </div>
            <div class="col-lg-7 p-4 p-lg-5 bg-white">
              <ul class="nav nav-pills mb-4" id="authTab" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab" aria-controls="signup-pane" aria-selected="true">Sign Up</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin-pane" type="button" role="tab" aria-controls="signin-pane" aria-selected="false">Sign In</button>
                </li>
              </ul>

              <div class="tab-content">
                <section class="tab-pane fade show active" id="signup-pane" role="tabpanel" aria-labelledby="signup-tab">
                  <form id="signUpForm">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label fw-semibold" for="txtFirstName">First Name</label>
                        <input class="form-control form-control-lg" id="txtFirstName" aria-label="First Name" aria-required="true" required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold" for="txtLastName">Last Name</label>
                        <input class="form-control form-control-lg" id="txtLastName" aria-label="Last Name" aria-required="true" required>
                      </div>
                    </div>
                    <div class="mt-3">
                      <label class="form-label fw-semibold mt-3" for="txtEmail">Email Address</label>
                      <input class="form-control form-control-lg" id="txtEmail" type="email" aria-label="Email Address" aria-required="true" required>
                    </div>
                    <div class="mt-3">
                      <label class="form-label fw-semibold mt-3" for="phone">Phone Number<br>
                        <small class="text-muted">Format: 123-456-7890</small>
                      </label>
                      <input class="form-control form-control-lg" id="phone" type="tel" name="phone" placeholder="123-456-7890" aria-label="Phone Number" maxlength="12">
                    </div>
                    <div class="mt-3">
                      <label class="form-label fw-semibold" for="txtPassword">Password</label>
                      <input class="form-control form-control-lg" id="txtPassword" type="password" aria-label="Password" aria-required="true" required>
                    </div>
                    <button class="btn btn-primary mt-4" type="submit">Create Account</button>
                  </form>
                </section>

                <section class="tab-pane fade" id="signin-pane" role="tabpanel" aria-labelledby="signin-tab">
                  <form id="signInForm">
                    <div class="mb-3">
                      <label class="form-label fw-semibold mt-3" for="txtSignInEmail">Email Address</label>
                      <input class="form-control form-control-lg" id="txtSignInEmail" type="email" aria-label="Email Address">
                    </div>
                    <div class="mb-3">
                      <label class="form-label fw-semibold mt-3" for="signInPhone">Phone Number<br>
                        <small class="text-muted">Format: 123-456-7890</small>
                      </label>
                      <input class="form-control form-control-lg" id="signInPhone" type="tel" name="signInPhone" placeholder="123-456-7890" aria-label="Phone Number" maxlength="12">
                    </div>
                    <div class="mb-3">
                      <label class="form-label fw-semibold" for="txtSignInPassword">Password</label>
                      <input class="form-control form-control-lg" id="txtSignInPassword" type="password" aria-label="Sign in password" aria-required="true" required>
                    </div>
                    <button class="btn btn-outline-primary" type="submit">Sign In</button>
                  </form>
                </section>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
