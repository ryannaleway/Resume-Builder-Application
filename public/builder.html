<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-requires-auth="true">
  <div class="page-shell">
    <nav class="navbar navbar-expand-lg bg-white border-bottom no-print">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Resume Builder</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link" href="/jobs">Manage Jobs</a>
          <a class="nav-link" href="/skills">Manage Skills</a>
          <a class="nav-link" href="/credentials">Certifications & Awards</a>
          <a class="nav-link active" href="/builder">Resume Builder</a>
          <a class="nav-link" href="/preview">Resume Preview</a>
          <span class="nav-link" data-user-name></span>
          <button class="btn btn-outline-secondary btn-sm ms-lg-2" data-action="logout" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-4">
      <div class="row g-4">
        <div class="col-xl-4 no-print">
          <div class="card border-0 shadow-sm selection-panel">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <div>
                  <p class="text-uppercase text-primary fw-semibold mb-1">Resume Builder</p>
                  <h1 class="h3 mb-0">Choose the content to include</h1>
                </div>
                <button class="btn btn-primary" id="openPreviewButton" type="button">Open Full Preview</button>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold" for="resumeContactMode">Resume Header Contact</label>
                <select class="form-select" id="resumeContactMode" aria-label="Resume header contact mode">
                  <option value="email">Show Email</option>
                  <option value="phone">Show Phone</option>
                  <option value="both">Show Both</option>
                </select>
              </div>
              <div id="selectionPanel" aria-live="polite"></div>
            </div>
          </div>
        </div>
        <div class="col-xl-8">
          <div id="resumePreviewContainer" aria-live="polite"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/builder.js"></script>
</body>
</html>
