<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Jobs</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page-shell" id="pageInteractionShell">
    <nav class="navbar navbar-expand-lg bg-white border-bottom no-print">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Resume Builder</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link active" href="/jobs">Manage Jobs</a>
          <a class="nav-link" href="/skills">Manage Skills</a>
          <a class="nav-link" href="/credentials">Certifications & Awards</a>
          <a class="nav-link" href="/builder">Resume Builder</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div id="globalAlert" aria-live="polite"></div>
      <header class="mb-4">
        <p class="text-uppercase text-primary fw-semibold mb-2">Manage Jobs</p>
        <h1 class="display-6 fw-bold">Capture job history and achievement-driven responsibilities.</h1>
      </header>

      <div class="row g-4">
        <div class="col-lg-5">
          <div id="jobsAlert" aria-live="polite"></div>
          <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
              <h2 class="h4">Job details</h2>
              <form id="jobForm">
                <div class="mb-3">
                  <label class="form-label" for="jobTitle">Title</label>
                  <input class="form-control" id="jobTitle" aria-label="Job title" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="jobCompany">Company</label>
                  <input class="form-control" id="jobCompany" aria-label="Company name" required>
                </div>
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label" for="jobStartDate">Start date</label>
                    <input class="form-control" id="jobStartDate" type="month" aria-label="Job start date" required>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label" for="jobEndDate">End date</label>
                    <input class="form-control" id="jobEndDate" type="month" aria-label="Job end date">
                  </div>
                </div>
                <div class="my-3">
                  <label class="form-label" for="jobLocation">Location</label>
                  <input class="form-control" id="jobLocation" aria-label="Job location">
                </div>
                <div class="mb-3">
                  <label class="form-label" for="jobSummary">Summary</label>
                  <textarea class="form-control" id="jobSummary" rows="4" aria-label="Job summary"></textarea>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn btn-primary" id="jobSubmitButton" type="submit">Save Job</button>
                  <button class="btn btn-outline-success" id="jobSuggestionButton" type="button">AI Improve Summary</button>
                </div>
              </form>
            </div>
          </div>

          <div id="responsibilitiesAlert" aria-live="polite"></div>
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <h2 class="h4">Responsibilities</h2>
              <form id="responsibilityForm">
                <div class="mb-3">
                  <label class="form-label" for="responsibilityJobId">Job</label>
                  <select class="form-select" id="responsibilityJobId" aria-label="Responsibility job selection" required></select>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="responsibilityDescription">Description</label>
                  <textarea class="form-control" id="responsibilityDescription" rows="4" aria-label="Responsibility description" required></textarea>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn btn-primary" id="responsibilitySubmitButton" type="submit">Save Responsibility</button>
                  <button class="btn btn-outline-success" id="responsibilitySuggestionButton" type="button">AI Improve Responsibility</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div id="jobList" aria-live="polite"></div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="suggestionModal" tabindex="-1" aria-labelledby="suggestionModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="suggestionModalLabel">AI Suggestions</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close suggestion modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="inlineGeminiApiKey">Optional Gemini API key for this request</label>
              <input class="form-control" id="inlineGeminiApiKey" aria-label="Temporary Gemini API key">
            </div>
            <div id="suggestionsList" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/suggestions.js"></script>
  <script src="/js/jobs.js"></script>
</body>
</html>
