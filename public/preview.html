<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-requires-auth="true">
  <div class="page-shell">
    <nav class="navbar navbar-expand-lg bg-white border-bottom no-print">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">Resume Builder</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="/">Dashboard</a>
          <a class="nav-link" href="/builder">Resume Builder</a>
          <a class="nav-link active" href="/preview">Resume Preview</a>
          <span class="nav-link" data-user-name></span>
          <button class="btn btn-outline-secondary btn-sm ms-lg-2" data-action="logout" type="button">Log Out</button>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4 no-print">
        <div>
          <p class="text-uppercase text-primary fw-semibold mb-1">Preview</p>
          <h1 class="h3 mb-0">Print-friendly resume output</h1>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="printResumeButton" type="button">Print Resume</button>
          <button class="btn btn-primary" id="downloadPdfButton" type="button">Download PDF</button>
        </div>
      </div>

      <div id="fullResumePreview" aria-live="polite"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/vendor/jspdf/jspdf.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/preview.js"></script>
</body>
</html>
